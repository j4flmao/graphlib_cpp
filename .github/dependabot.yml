version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    open-pull-requests-limit: 10
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
  - package-ecosystem: cmake
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
